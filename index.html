<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lernwortschatz — Wörter & Artikel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F0E1; --ink:#232A3B; --ink-soft:#5B6072;
    --red:#B23A32; --mustard:#D9A62E; --green:#3F6B3F; --line:#C9BE9E;
    --card-shadow: 0 2px 0 var(--line), 0 10px 24px rgba(35,42,59,0.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Work Sans', sans-serif; min-height:100vh; padding:32px 16px 64px;
  }
  .wrap{max-width:640px; margin:0 auto;}
  .eyebrow{font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--red); margin:0 0 6px;}
  h1{font-family:'Fraunces', serif; font-weight:700; font-size:32px; margin:0 0 6px; letter-spacing:-0.01em;}
  .sub{color:var(--ink-soft); font-size:14.5px; margin:0 0 20px;}

  .scorebar{display:flex; justify-content:space-between; align-items:center;
    font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--ink-soft); margin-bottom:14px;}
  .scorebar b{color:var(--ink); font-size:15px;}
  .topbtn{border:1px solid var(--line); background:transparent; color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace; font-size:12px; padding:4px 9px; border-radius:4px; cursor:pointer;}
  .topbtn:hover{border-color:var(--red); color:var(--red);}

  .progressbg{height:5px; background:var(--line); border-radius:3px; margin-bottom:22px; overflow:hidden;}
  .progressfg{height:100%; background:var(--mustard); width:0%; transition:width .3s ease;}

  .card{background:#FFFDF7; border:1px solid var(--line); border-radius:6px;
    box-shadow:var(--card-shadow); padding:28px 26px 24px; position:relative; overflow:hidden;}
  .card::before{content:''; position:absolute; top:0; left:0; right:0; height:6px;
    background:repeating-linear-gradient(90deg, var(--mustard) 0 14px, transparent 14px 22px); opacity:.55;}
  .cat{display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; color:#fff; background:var(--ink); padding:3px 9px; border-radius:3px; margin-bottom:16px;}
  .word{font-family:'Fraunces', serif; font-size:30px; font-weight:700; margin:0 0 4px;}
  .hint{color:var(--ink-soft); font-size:13px; margin:0 0 20px;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-family:'IBM Plex Mono', monospace; font-size:12px;
    letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:5px;}
  .field input{
    width:100%; border:1.5px solid var(--line); border-radius:5px; padding:11px 13px;
    font-size:15.5px; font-family:'Work Sans'; background:var(--paper); color:var(--ink);
  }
  .field input:focus{outline:2px solid var(--red); outline-offset:1px;}
  .field.ok input{border-color:var(--green); background:#EEF4EA;}
  .field.bad input{border-color:var(--red); background:#F9EDEB;}

  button.checkbtn{
    width:100%; border:none; background:var(--ink); color:#fff; border-radius:5px;
    padding:13px; font-family:'Work Sans'; font-weight:600; font-size:15px; cursor:pointer; margin-top:4px;
  }
  button.checkbtn:hover{background:var(--red);}

  .options{display:flex; gap:9px; margin-bottom:6px;}
  .opt{
    flex:1; text-align:center; border:1.5px solid var(--line); background:var(--paper);
    border-radius:5px; padding:14px 8px; font-size:17px; font-weight:700; font-family:'Fraunces', serif;
    cursor:pointer; transition:.15s ease; color:var(--ink);
  }
  .opt:hover{border-color:var(--ink-soft);}
  .opt.correct{background:#E7EFE2; border-color:var(--green); color:var(--green);}
  .opt.incorrect{background:#F5E4E1; border-color:var(--red); color:var(--red);}
  .opt:disabled{cursor:default;}

  .feedback{margin-top:16px; padding:12px 14px; border-radius:5px; font-size:14.5px; display:none; line-height:1.55;}
  .feedback.show{display:block;}
  .feedback.ok{background:#E7EFE2; color:var(--green); border:1px solid var(--green);}
  .feedback.bad{background:#F5E4E1; color:var(--red); border:1px solid var(--red);}
  .feedback b{font-family:'IBM Plex Mono', monospace;}
  .feedback .transline{display:block; margin-top:6px; font-family:'Work Sans'; color:var(--ink);}

  .nextbtn{margin-top:14px; width:100%; border:none; background:var(--red); color:#fff;
    padding:13px; border-radius:5px; font-family:'Work Sans'; font-weight:600; font-size:15px;
    cursor:pointer; display:none;}
  .nextbtn.show{display:block;}
  .nextbtn:hover{background:#961e17;}
  .countdown{font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--ink-soft);
    margin-top:8px; text-align:right;}

  .done-screen{text-align:center; padding:40px 20px;}
  .done-screen .big{font-family:'Fraunces', serif; font-size:52px; font-weight:700; color:var(--red);}
  .done-screen p{color:var(--ink-soft); font-size:15px;}
  .restart, .menubtn{margin-top:10px; border:1.5px solid var(--ink); background:transparent; color:var(--ink);
    padding:11px 22px; border-radius:5px; font-family:'Work Sans'; font-weight:600; cursor:pointer; font-size:14.5px;}
  .restart:hover, .menubtn:hover{background:var(--ink); color:#fff;}

  .modgrid{display:flex; flex-direction:column; gap:10px;}
  .sectionlabel{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-soft); margin:18px 0 8px;
  }
  .sectionlabel:first-child{margin-top:0;}
  .modcard{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    border:1.5px solid var(--line); background:#FFFDF7; border-radius:6px;
    padding:14px 16px; cursor:pointer; transition:.15s ease; text-align:left; width:100%;
  }
  .modcard:hover{border-color:var(--red);}
  .modcard.completed{border-color:var(--green); background:#EEF4EA;}
  .modleft{display:flex; flex-direction:column; gap:3px;}
  .modtitle{font-family:'Fraunces', serif; font-weight:700; font-size:17px;}
  .modrange{font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft);}
  .modscore{font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--green); font-weight:600; white-space:nowrap;}
  .modarrow{color:var(--red); font-size:18px;}

  .dirchoice{text-align:center; padding:10px 4px 4px;}
  .dirchoice p{color:var(--ink-soft); font-size:14px; margin-bottom:18px;}
  .dirbtn{
    display:block; width:100%; border:1.5px solid var(--line); background:var(--paper);
    border-radius:6px; padding:16px; margin-bottom:12px; cursor:pointer; text-align:left;
  }
  .dirbtn:hover{border-color:var(--red);}
  .dirbtn b{font-family:'Fraunces', serif; font-size:17px; display:block;}
  .dirbtn span{color:var(--ink-soft); font-size:13px;}
  .backlink{background:transparent; border:none; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;
    font-size:12px; cursor:pointer; margin-top:6px;}
  .backlink:hover{color:var(--red);}

  footer{text-align:center; color:var(--ink-soft); font-size:12.5px; margin-top:22px; font-family:'IBM Plex Mono', monospace;}

  /* ===== Quiz module (fusionne) ===== */
  .partpos{color:var(--ink-soft); font-size:11.5px;}
  .restart-inline{
    border:1px solid var(--line); background:transparent; color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace; font-size:12px; padding:4px 9px;
    border-radius:4px; cursor:pointer;
  }
  .restart-inline:hover{border-color:var(--red); color:var(--red);}

  .modeSelect{display:flex; flex-direction:column; gap:12px; margin-bottom:24px;}
  .modeCard{
    text-align:left; border:1.5px solid var(--line); background:#FFFDF7;
    border-radius:6px; padding:18px 20px; cursor:pointer; transition:.15s ease;
  }
  .modeCard:hover{border-color:var(--red);}
  .modeCard.hard{border-color:#8a2d27; background:#2A1E1E;}
  .modeCard.hard:hover{border-color:var(--red);}
  .modeCard .modeTitle{display:block; font-family:'Fraunces', serif; font-weight:700; font-size:19px; margin-bottom:5px;}
  .modeCard.hard .modeTitle{color:#F2C4C0;}
  .modeCard .modeDesc{display:block; font-size:13px; color:var(--ink-soft); line-height:1.5;}
  .modeCard.hard .modeDesc{color:#D9B8B5;}
  .partCard{position:relative;}
  .partCard.partDone{border-color:var(--green); background:#F3F8F0;}
  .partCard.partDone .modeTitle{color:var(--green);}

  .rail{display:flex; gap:6px; margin:20px 0 26px; flex-wrap:wrap;}
  .partbtn{
    border:1.5px solid var(--line); background:var(--paper); color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:600;
    padding:7px 12px; border-radius:5px; cursor:pointer; transition:.15s ease;
  }
  .partbtn:hover{border-color:var(--ink-soft); color:var(--ink);}
  .partbtn.done{background:var(--mustard); border-color:var(--mustard); color:var(--ink);}
  .partbtn.now{background:var(--red); border-color:var(--red); color:#fff; transform:translateY(-2px);}

  .qnum{color:var(--ink-soft); font-size:13px; font-family:'IBM Plex Mono',monospace; margin-left:8px;}
  .prevbtn{
    float:right; border:1px solid var(--line); background:transparent; color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; padding:4px 9px;
    border-radius:4px; cursor:pointer;
  }
  .prevbtn:hover{border-color:var(--ink); color:var(--ink);}
  .question{font-family:'Fraunces', serif; font-size:22px; line-height:1.35; font-weight:600; margin:0 0 20px;}

  .qoptions{display:flex; flex-direction:column; gap:9px; margin-bottom:6px;}
  .qopt{
    text-align:left; border:1.5px solid var(--line); background:var(--paper);
    border-radius:5px; padding:12px 14px; font-size:15.5px; font-family:'Work Sans';
    cursor:pointer; transition:.15s ease; color:var(--ink); width:100%;
  }
  .qopt:hover{border-color:var(--ink-soft);}
  .qopt.correct{background:#E7EFE2; border-color:var(--green); color:var(--green); font-weight:600;}
  .qopt.incorrect{background:#F5E4E1; border-color:var(--red); color:var(--red); font-weight:600;}
  .qopt:disabled{cursor:default;}

  .textrow{display:flex; gap:8px;}
  input.textin{
    flex:1; border:1.5px solid var(--line); border-radius:5px; padding:12px 14px;
    font-size:15.5px; font-family:'Work Sans'; background:var(--paper); color:var(--ink);
  }
  input.textin:focus{outline:2px solid var(--red); outline-offset:1px;}
  .langhint{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); margin:6px 0 0; font-style:italic;}
  .feedback .meaning{display:inline-block; margin-top:6px; font-size:13px; font-style:italic; color:var(--ink-soft);}

  .dropdown{margin-bottom:12px; border:1.5px solid var(--line); border-radius:6px; overflow:hidden; background:#FFFDF7;}
  .dropdown-header{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    border:none; background:transparent; padding:15px 16px; cursor:pointer;
    font-family:'IBM Plex Mono', monospace; font-size:12.5px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-soft);
  }
  .dropdown-header:hover{color:var(--red);}
  .dropdown-arrow{font-size:14px; color:var(--red);}
  .dropdown-body{padding:0 14px 14px;}
  .dropdown-body .modgrid{display:flex; flex-direction:column; gap:10px;}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Lernwortschatz · Kapitel 1–2</p>
  <h1>Wörter & Artikel</h1>
  <p class="sub" id="subtitle">Choisis un module de 10 mots ou d'articles à réviser.</p>

  <div class="scorebar" id="scorebarTop" style="display:none;">
    <span>Mot <b id="qpos">1</b> / <b id="qtotal"></b></span>
    <span>Score module : <b id="scorenow">0</b></span>
    <button class="topbtn" id="menuBtnTop">☰ Menu des modules</button>
  </div>
  <div class="progressbg" id="progressbg" style="display:none;"><div class="progressfg" id="progressfg"></div></div>

  <div class="scorebar" id="qzScorebarWrap" style="display:none;">
    <span>Question <b id="qzQpos">1</b> / <b id="qzQtotal">100</b> <span id="qzPartpos" class="partpos"></span></span>
    <span>Score : <b id="qzScorenow">0</b></span>
    <button class="restart-inline" id="qzRestartInlineBtn">Recommencer</button>
    <button class="restart-inline" id="qzPartMenuBtn">Parties</button>
    <button class="restart-inline" id="qzHomeBtn">Accueil</button>
  </div>
  <div class="rail" id="qzRail" style="display:none;"></div>

  <div class="card" id="card"></div>
  <footer>Lernwortschatz · vocabulaire tiré des pages Menschen A1 · by Ange TNT</footer>
</div>

<script>
/* ---------- Vocabulaire : mot, catégorie, sens en français ---------- */
const allWords = [

  ["Tschüss","Begrüßung",["salut (au revoir familier)","salut","au revoir"]],

  ["Was...?","Arbeit",["quoi"]],

  ["Alter","Persönliches",["âge"]],
  ["Familienstand","Persönliches",["état civil"]],
  ["Jahr","Persönliches",["année","an"]],

  ["Arzt","Berufe",["médecin"]],
  ["Friseur","Berufe",["coiffeur"]],
  ["Ingenieur","Berufe",["ingénieur"]],

  ["Lehrer","Berufe",["enseignant","professeur"]],

  ["nicht","Weitere Wörter",["ne...pas"]],

/* ---------- Articles : article, mot (singulier), pluriel, sens en français ---------- */
const articleWords = [
  ["der","Arbeitgeber","Arbeitgeber","employeur"],
  ["die","Ausbildung","Ausbildungen","formation"],
  ["der","Beruf","Berufe","métier"],
  ["die","Hochschule","Hochschulen","université / grande école"],
  ["der","Job","Jobs","emploi"],
  ["das","Praktikum","Praktika","stage"],
  ["die","Schule","Schulen","école"],
  ["die","Stelle","Stellen","poste"],
  ["das","Alter","—","âge"],
  ["der","Familienstand","—","état civil"],

  ["das","Jahr","Jahre","année"],
  ["das","Kind","Kinder","enfant"],
  ["der","Architekt","Architekten","architecte"],
  ["der","Arzt","Ärzte","médecin"],
  ["der","Friseur","Friseure","coiffeur"],
  ["der","Ingenieur","Ingenieure","ingénieur"],
  ["der","Journalist","Journalisten","journaliste"],
  ["der","Kellner","Kellner","serveur"],
  ["die","Krankenschwester","Krankenschwestern","infirmière"],
  ["der","Lehrer","Lehrer","enseignant"],

  ["der","Mechatroniker","Mechatroniker","mécatronicien"],
  ["der","Student","Studenten","étudiant"],
  ["der","Schauspieler","Schauspieler","acteur"],
  ["der","Schüler","Schüler","élève"],
  ["der","Sekretär","Sekretäre","secrétaire"],
  ["der","Verkäufer","Verkäufer","vendeur"],
  ["die","Frau","Frauen","madame / femme"],
  ["der","Herr","Herren","monsieur"],
  ["der","Name","Namen","nom"],
  ["der","Vorname","Vornamen","prénom"],

  ["das","Land","Länder","pays"],
  ["die","Schweiz","—","Suisse"],
  ["das","Alphabet","Alphabete","alphabet"],
];

const MOD_SIZE = 10;

function chunk(arr){
  const out=[];
  for(let i=0;i<arr.length;i+=MOD_SIZE) out.push(arr.slice(i,i+MOD_SIZE));
  return out;
}

/* module list: {type:'vocab'|'artikel', items:[...], label} */
const modules = [
  ...chunk(allWords).map(items=>({type:'vocab', items})),
  ...chunk(articleWords).map(items=>({type:'artikel', items})),
];
const moduleScores = modules.map(()=>null);

let currentMod = 0;
let direction = 'de-fr'; // for vocab modules: 'de-fr' or 'fr-de'
let modItems = [];
let idx=0, score=0, answered=false, autoTimer=null, countdownTimer=null;
const DELAY = 4;

const cardEl = document.getElementById('card');
const scorebarTopEl = document.getElementById('scorebarTop');
const progressbgEl = document.getElementById('progressbg');
const progressfgEl = document.getElementById('progressfg');
const qposEl = document.getElementById('qpos');
const qtotalEl = document.getElementById('qtotal');
const scoreEl = document.getElementById('scorenow');
const subtitleEl = document.getElementById('subtitle');

document.getElementById('menuBtnTop').addEventListener('click', ()=>{ clearAutoAdvance(); showMenu(); });

function norm(s){
  return s.trim().toLowerCase()
    .replace(/['’]/g,"'").replace(/[.!?]/g,'')
    .replace(/ß/g,"ss")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function normKeepUmlaut(s){
  return s.trim().toLowerCase().replace(/[.!?]/g,'').replace(/ß/g,"ss");
}
function matches(input, accepted, keepUmlaut){
  const n = keepUmlaut ? normKeepUmlaut(input) : norm(input);
  if(!n) return false;
  return accepted.some(a=>{
    const na = keepUmlaut ? normKeepUmlaut(a) : norm(a);
    return n===na || n.includes(na) || na.includes(n);
  });
}

/* ---------------- MENU ---------------- */
function showMenu(){
  scorebarTopEl.style.display='none';
  progressbgEl.style.display='none';
  const qzBar = document.getElementById('qzScorebarWrap');
  const qzRailEl = document.getElementById('qzRail');
  if(qzBar) qzBar.style.display='none';
  if(qzRailEl) qzRailEl.style.display='none';
  subtitleEl.textContent = "Choisis un module de 10 mots, d'articles, ou un quiz complet à réviser.";

  let vocabCards = '';
  let artikelCards = '';
  modules.forEach((mod,i)=>{
    const first = mod.items[0][mod.type==='vocab'?0:1];
    const last = mod.items[mod.items.length-1][mod.type==='vocab'?0:1];
    const done = moduleScores[i];
    const label = mod.type==='vocab' ? `Module ${i+1}` : `Artikel ${i - chunk(allWords).length + 1}`;
    const cardHtml = `<button class="modcard ${done?'completed':''}" data-mod="${i}">
      <div class="modleft">
        <span class="modtitle">${label}</span>
        <span class="modrange">${first} → ${last} · ${mod.items.length} ${mod.type==='vocab'?'mots':'articles'}</span>
      </div>
      ${done ? `<span class="modscore">${done.score}/${done.total} ✓</span>` : `<span class="modarrow">→</span>`}
    </button>`;
    if(mod.type==='vocab') vocabCards += cardHtml; else artikelCards += cardHtml;
  });

  const quizCards = `<button class="modcard" id="quizStdCard">
      <div class="modleft">
        <span class="modtitle">Quiz standard</span>
        <span class="modrange">100 questions — Begrüßung, Fragen, Berufe, Verben, Zahlen, textes</span>
      </div>
      <span class="modarrow">→</span>

  function dropdown(id, title, bodyHtml){

      <button class="dropdown-header" data-drop="${id}">

  html += dropdown('artikel', 'Articles — der / die / das', artikelCards);
  html += dropdown('quiz', 'Quiz', quizCards);

  cardEl.innerHTML = html;

  cardEl.querySelectorAll('.dropdown-header').forEach(hdr=>{
    hdr.addEventListener('click', ()=>{
      const id = hdr.dataset.drop;

      body.style.display = open ? 'none' : 'block';

    btn.addEventListener('click', ()=> openModule(parseInt(btn.dataset.mod)));

/* ---------------- DIRECTION CHOICE (vocab modules only) ---------------- */
function openModule(i){
  const mod = modules[i];
  if(mod.type==='artikel'){
    startModule(i);
    return;
  }
  currentMod = i;
  scorebarTopEl.style.display='none';
  progressbgEl.style.display='none';
  subtitleEl.textContent = `Module ${i+1} — choisis le sens de la révision.`;
  cardEl.innerHTML = `
    <div class="dirchoice">
      <p>Comment veux-tu réviser ce module ?</p>
      <button class="dirbtn" id="deFrBtn">
        <b>Allemand → Français</b>
        <span>Le mot allemand est donné, tu écris le sens en français.</span>
      </button>
      <button class="dirbtn" id="frDeBtn">
        <b>Français → Allemand</b>
        <span>Le sens en français est donné, tu écris le mot en allemand.</span>
      </button>
      <button class="backlink" id="backBtn">← Retour au menu</button>
    </div>
  `;
  document.getElementById('deFrBtn').addEventListener('click', ()=>{ direction='de-fr'; startModule(i); });
  document.getElementById('frDeBtn').addEventListener('click', ()=>{ direction='fr-de'; startModule(i); });
  document.getElementById('backBtn').addEventListener('click', showMenu);
}

/* ---------------- QUIZ ---------------- */
function startModule(i){
  currentMod = i;
  modItems = modules[i].items.slice();
  idx=0; score=0; answered=false;
  scorebarTopEl.style.display='flex';
  progressbgEl.style.display='block';
  qtotalEl.textContent = modItems.length;
  const mod = modules[i];
  const dirLabel = mod.type==='vocab' ? (direction==='de-fr' ? ' · Allemand → Français' : ' · Français → Allemand') : '';
  subtitleEl.textContent = (mod.type==='vocab' ? `Module ${i+1}` : `Articles ${i+1}`) + dirLabel;
  render();
}

function updateProgress(){
  progressfgEl.style.width = Math.round((idx/modItems.length)*100)+"%";
}

function render(){
  answered=false;
  const mod = modules[currentMod];
  qposEl.textContent = idx+1;
  scoreEl.textContent = score;
  updateProgress();

  if(mod.type==='vocab'){
    renderVocab();
  } else {
    renderArtikel();
  }
}

function renderVocab(){
  const [word, cat, fr] = modItems[idx];
  const promptText = direction==='de-fr' ? word : fr[0];
  const label = direction==='de-fr' ? 'Français' : 'Deutsch';

  cardEl.innerHTML = `
    <span class="cat">${cat}</span>
    <p class="word">${promptText}</p>
    <p class="hint">${direction==='de-fr' ? 'Donne le sens en français.' : 'Écris le mot en allemand.'}</p>
    <div class="field" id="fieldAns">
      <label>${label}</label>
      <input type="text" id="inAns" autocomplete="off" placeholder="…">
    </div>
    <button class="checkbtn" id="checkbtn">Vérifier</button>
    <div class="feedback" id="fb"></div>
    <button class="nextbtn" id="nextbtn">${idx===modItems.length-1 ? 'Voir le résultat du module →' : 'Suivant maintenant →'}</button>
    <p class="countdown" id="countdown"></p>
  `;

  const inAns = document.getElementById('inAns');
  const submit = ()=>checkVocab(word, fr);
  document.getElementById('checkbtn').addEventListener('click', submit);
  inAns.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  document.getElementById('nextbtn').addEventListener('click', next);
  inAns.focus();
}

function checkVocab(word, fr){
  if(answered) return;
  answered=true;
  const inAns = document.getElementById('inAns');
  const target = direction==='de-fr' ? fr : [word];
  const keepUmlaut = direction==='fr-de';
  const ok = matches(inAns.value, target, keepUmlaut);
  inAns.disabled = true;
  document.getElementById('checkbtn').disabled = true;
  document.getElementById('fieldAns').classList.add(ok?'ok':'bad');
  if(ok) score++;

  const translation = direction==='de-fr' ? fr[0] : word;
  const fb = document.getElementById('fb');
  fb.className = 'feedback show '+(ok?'ok':'bad');
  fb.innerHTML = (ok ? `<b>✓ Richtig!</b>` : `<b>✗ Presque.</b> Réponse correcte : <b>${translation}</b>`)
    + `<span class="transline">${word} = ${fr[0]}</span>`;
  scoreEl.textContent = score;
  document.getElementById('nextbtn').classList.add('show');
  startAutoAdvance();
}

function renderArtikel(){
  const [article, noun, plural, trans] = modItems[idx];
  cardEl.innerHTML = `
    <span class="cat">Artikel</span>
    <p class="word">${noun}</p>
    <p class="hint">Quel article correspond à ce mot ?</p>
    <div class="options">
      <button class="opt" data-a="der">der</button>
      <button class="opt" data-a="die">die</button>
      <button class="opt" data-a="das">das</button>
    </div>
    <div class="feedback" id="fb"></div>
    <button class="nextbtn" id="nextbtn">${idx===modItems.length-1 ? 'Voir le résultat du module →' : 'Suivant maintenant →'}</button>
    <p class="countdown" id="countdown"></p>
  `;
  cardEl.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>checkArtikel(btn, article, noun, plural, trans));
  });
  document.getElementById('nextbtn').addEventListener('click', next);
}

function checkArtikel(btn, article, noun, plural, trans){
  if(answered) return;
  answered=true;
  const chosen = btn.dataset.a;
  const ok = chosen === article;
  if(ok) score++;
  cardEl.querySelectorAll('.opt').forEach(o=>{
    o.disabled = true;
    if(o.dataset.a === article) o.classList.add('correct');
    else if(o===btn) o.classList.add('incorrect');
  });
  const pluralLine = plural==='—' ? 'pas de pluriel courant' : `die ${plural}`;
  const fb = document.getElementById('fb');
  fb.className = 'feedback show '+(ok?'ok':'bad');
  fb.innerHTML = (ok ? `<b>✓ Richtig!</b> ${article} ${noun}` : `<b>✗ Presque.</b> Réponse correcte : <b>${article} ${noun}</b>`)
    + `<span class="transline">Pluriel : ${pluralLine} · Traduction : ${trans}</span>`;
  scoreEl.textContent = score;
  document.getElementById('nextbtn').classList.add('show');
  startAutoAdvance();
}

/* ---------------- FLOW CONTROL ---------------- */
function startAutoAdvance(){
  let remaining = DELAY;
  const cd = document.getElementById('countdown');
  cd.textContent = `Suite dans ${remaining}s…`;
  clearInterval(countdownTimer); clearTimeout(autoTimer);
  countdownTimer = setInterval(()=>{
    remaining--;
    if(remaining>0 && cd) cd.textContent = `Suite dans ${remaining}s…`;
  }, 1000);
  autoTimer = setTimeout(()=>{ clearInterval(countdownTimer); next(); }, DELAY*1000);
}
function clearAutoAdvance(){ clearTimeout(autoTimer); clearInterval(countdownTimer); }

function next(){
  clearAutoAdvance();
  if(idx < modItems.length-1){ idx++; render(); }
  else finishModule();
}

function finishModule(){
  progressfgEl.style.width="100%";
  moduleScores[currentMod] = {score, total: modItems.length};
  const pct = Math.round((score/modItems.length)*100);
  let msg = "Repasse sur ce module pour consolider.";
  if(pct>=90) msg="Module maîtrisé, bravo !";
  else if(pct>=70) msg="Très solide.";
  else if(pct>=50) msg="Bonne base, encore un peu d'entraînement.";

  const isLast = currentMod === modules.length-1;
  const doneCount = moduleScores.filter(Boolean).length;

  cardEl.innerHTML = `<div class="done-screen">
    <div class="big">${score}/${modItems.length}</div>
    <p>Module terminé — ${pct}% — ${msg}</p>
    <p style="font-family:'IBM Plex Mono',monospace; font-size:12.5px;">${doneCount}/${modules.length} modules complétés au total</p>
    <button class="restart" id="retryBtn">Refaire ce module</button>
    ${!isLast ? `<button class="menubtn" id="nextModBtn">Module suivant →</button>` : ``}
    <button class="menubtn" id="menuBtn2">☰ Retour au menu</button>
  </div>`;
  document.getElementById('retryBtn').addEventListener('click', ()=>{
    if(modules[currentMod].type==='vocab') openModule(currentMod); else startModule(currentMod);
  });
  document.getElementById('menuBtn2').addEventListener('click', showMenu);
  if(!isLast){
    document.getElementById('nextModBtn').addEventListener('click', ()=>{
      const ni = currentMod+1;
      if(modules[ni].type==='vocab') openModule(ni); else startModule(ni);
    });
  }
}

/* ---------- Programmatic generation: verb conjugation drills ---------- */
const conj = {
  machen:  {ich:"mache",  du:"machst",  er:"macht",  wir:"machen", ihr:"macht",  sie:"machen"},
  leben:   {ich:"lebe",   du:"lebst",   er:"lebt",   wir:"leben",  ihr:"lebt",   sie:"leben"},
  wohnen:  {ich:"wohne",  du:"wohnst",  er:"wohnt",  wir:"wohnen", ihr:"wohnt",  sie:"wohnen"},
  arbeiten:{ich:"arbeite",du:"arbeitest",er:"arbeitet",wir:"arbeiten",ihr:"arbeitet",sie:"arbeiten"},
  kommen:  {ich:"komme",  du:"kommst",  er:"kommt",  wir:"kommen", ihr:"kommt",  sie:"kommen"},
  heißen:  {ich:"heiße",  du:"heißt",   er:"heißt",  wir:"heißen", ihr:"heißt",  sie:"heißen"},
  studieren:{ich:"studiere",du:"studierst",er:"studiert",wir:"studieren",ihr:"studiert",sie:"studieren"},
};
const pronounLabel = {ich:"Ich", du:"Du", er:"Er/Sie", wir:"Wir", ihr:"Ihr", sie:"sie/Sie"};
const persons = ["ich","du","er","wir","ihr","sie"];
const verbList = Object.keys(conj);
const filler = { arbeiten:"[im Büro]", wohnen:"[in Berlin]", leben:"[in Malaga]", machen:"[eine Ausbildung]", kommen:"[aus Kamerun]", heißen:"[Ange]", studieren:"[Maschinenbau]" };

/* traductions françaises pour la « signification » affichée après réponse */
const conjFr = {
  machen:   {ich:"fais",   du:"fais",    er:"fait",   wir:"faisons",       ihr:"faites",       sie:"font"},
  leben:    {ich:"vis",    du:"vis",     er:"vit",    wir:"vivons",        ihr:"vivez",        sie:"vivent"},
  wohnen:   {ich:"habite", du:"habites", er:"habite", wir:"habitons",      ihr:"habitez",      sie:"habitent"},
  arbeiten: {ich:"travaille", du:"travailles", er:"travaille", wir:"travaillons", ihr:"travaillez", sie:"travaillent"},
  kommen:   {ich:"viens",  du:"viens",   er:"vient",  wir:"venons",        ihr:"venez",        sie:"viennent"},
  heißen:   {ich:"m'appelle", du:"t'appelles", er:"s'appelle", wir:"nous appelons", ihr:"vous appelez", sie:"s'appellent"},
  studieren:{ich:"étudie", du:"étudies", er:"étudie", wir:"étudions",      ihr:"étudiez",      sie:"étudient"},
};
const pronounFr = {ich:"Je", du:"Tu", er:"Il/Elle", wir:"Nous", ihr:"Vous", sie:"Ils/Elles"};
const fillerFr = { arbeiten:"au bureau", wohnen:"à Berlin", leben:"à Malaga", machen:"une formation", kommen:"du Cameroun", heißen:"Ange", studieren:"en mécanique" };

const generated = [];
verbList.forEach(v=>{
  persons.forEach(p=>{
    const correct = conj[v][p];
    // build distractors from other persons of same verb
    let distractors = persons.filter(x=>x!==p).map(x=>conj[v][x]).filter(x=>x!==correct);
    distractors = [...new Set(distractors)].slice(0,3);
    while(distractors.length<3){ distractors.push(correct+"n"); }
    const opts = [correct, ...distractors];
    // shuffle options
    for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [opts[i],opts[j]]=[opts[j],opts[i]];}
    const trText = `${pronounFr[p]} ${conjFr[v][p]} ${fillerFr[v]}.`;
    generated.push({
      cat:"Verben: "+v,
      type:"mcq",
      q:`${pronounLabel[p]} ___ ${filler[v]}. (${v})`,
      opts, answer: correct, tr: trText
    });
  });
});

// shuffle generated pool, then take just enough to reach 100 total
for(let i=generated.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [generated[i],generated[j]]=[generated[j],generated[i]];}
const needed = Math.max(0, 100 - bank.length);
let standardQuestions = bank.concat(generated.slice(0, needed));
standardQuestions = standardQuestions.slice(0,100);

function shuffleCopy(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];}
  return a;
  }
  /* ---------- Quiz engine ---------- */
let mode = null; // 'standard' | 'hard'
let questions = [];
let idx = 0, score = 0, answered = false, wrongIdx = new Set();
let partSize = 1; // taille de chaque fragment (10 fragments par quiz)
let completedParts = new Set();
const card = document.getElementById('card');
const rail = document.getElementById('qzRail');
const qposEl = document.getElementById('qzQpos');
const scoreEl = document.getElementById('qzScorenow');
const scorebarWrap = document.getElementById('qzScorebarWrap');

function goHome(){
  clearAutoAdvance();
  scorebarWrap.style.display='none';
  rail.style.display='none';
  showMenu();
}

function startMode(chosen){
  mode = chosen;
  questions = shuffleCopy(chosen==='standard' ? standardQuestions : hardBank);
  idx=0; score=0; wrongIdx=new Set(); completedParts=new Set();
  partSize = Math.max(1, Math.ceil(questions.length/10));
  document.getElementById('subtitle').textContent = chosen==='standard'
    ? "Quiz standard — 100 questions de révision — Begrüßung, Fragen, Berufe, Verben, Zahlen."
    : "Quiz difficile — 50 questions extrêmement difficiles — conjugaison, articles, mein-/dein-, ja/nein/doch, correction de fautes.";
  buildRail();
  showPartMenu();
}

function showPartMenu(){
  clearAutoAdvance();
  scorebarWrap.style.display='none';
  rail.style.display='none';
  const totalParts = Math.ceil(questions.length/partSize);
  let html = `<button class="backlink" id="qzBackHome">← Retour à l'accueil</button>
    <p class="sub">Choisis une partie — ${questions.length} questions réparties en ${totalParts} parties. Score actuel : ${score}/${idx}.</p>
    <div class="modeSelect">`;
  for(let p=0; p<totalParts; p++){
    const start = p*partSize;
    const end = Math.min(start+partSize, questions.length);
    const done = completedParts.has(p);
    html += `<button class="modeCard partCard ${done?'partDone':''}" data-p="${p}">
      <span class="modeTitle">Partie ${p+1}${done ? ' ✓' : ''}</span>
      <span class="modeDesc">Questions ${start+1}–${end}</span>
    </button>`;
  }
  html += `</div>`;
  card.innerHTML = html;
  document.getElementById('qzBackHome').addEventListener('click', goHome);
  card.querySelectorAll('[data-p]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      idx = parseInt(btn.dataset.p) * partSize;
      scorebarWrap.style.display='flex';
      rail.style.display='flex';
      document.getElementById('qzQtotal').textContent = questions.length;
      render();
    });
  });
}

document.getElementById('qzHomeBtn').addEventListener('click', goHome);
document.getElementById('qzPartMenuBtn').addEventListener('click', ()=>{
  clearAutoAdvance();
  showPartMenu();
});

function buildRail(){
  rail.innerHTML='';
  const totalParts = Math.ceil(questions.length/partSize);
  for(let p=0; p<totalParts; p++){
    const b=document.createElement('button');
    b.className='partbtn';
    b.id='partbtn'+p;
    b.textContent = 'Partie ' + (p+1);
    b.addEventListener('click', ()=>jumpToPart(p));
    rail.appendChild(b);
  }
}
function updateRail(){
  const totalParts = Math.ceil(questions.length/partSize);
  const currentPart = Math.floor(idx/partSize);
  for(let p=0; p<totalParts; p++){
    const b=document.getElementById('partbtn'+p);
    if(!b) continue;
    const partEnd = Math.min((p+1)*partSize, questions.length) - 1;
    let cls = 'partbtn';
    if(p===currentPart) cls += ' now';
    else if(partEnd < idx) cls += ' done';
    b.className = cls;
  }
}
function jumpToPart(p){
  clearAutoAdvance();
  idx = p*partSize;
  render();
}

function norm(s){ return s.trim().toLowerCase().replace(/[.!?]/g,''); }

function render(){
  answered=false;
  const q = questions[idx];
  qposEl.textContent = idx+1;
  scoreEl.textContent = score;
  const totalParts = Math.ceil(questions.length/partSize);
  const currentPart = Math.floor(idx/partSize)+1;
  document.getElementById('qzPartpos').textContent = `· Partie ${currentPart}/${totalParts}`;
  updateRail();

  let html = `<span class="cat">${q.cat}</span><span class="qnum">#${idx+1}</span>`;
  if(idx>0){
    html += `<button class="prevbtn" id="prevbtn">← Précédent</button>`;
  }
  html += `<p class="question">${q.q}</p>`;

  if(q.type==='mcq'){
    html += `<div class="qoptions">` + q.opts.map((o,i)=>
      `<button class="qopt" data-i="${i}">${o}</button>`).join('') + `</div>`;
  } else {
    const langHint = /^[0-9]+$/.test(q.answer) ? "en chiffres" : "en allemand";
    html += `<div class="textrow">
      <input type="text" class="textin" id="tin" placeholder="Ta réponse…" autocomplete="off">
      <button class="checkbtn" id="checkbtn">Vérifier</button>
    </div>
    <p class="langhint">Réponds ${langHint}</p>`;
  }
  html += `<div class="feedback" id="fb"></div>
    <button class="nextbtn" id="nextbtn">${idx===questions.length-1 ? 'Voir le résultat maintenant' : 'Suivant maintenant →'}</button>
    <p class="countdown" id="countdown"></p>`;
  card.innerHTML = html;

  if(q.type==='mcq'){
    card.querySelectorAll('.qopt').forEach(btn=>{
      btn.addEventListener('click', ()=>handleMcq(btn, q));
    });
  } else {
    const input = document.getElementById('tin');
    const check = document.getElementById('checkbtn');
    const submit = ()=>handleText(input.value, q);
    check.addEventListener('click', submit);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
    input.focus();
  }
  document.getElementById('nextbtn').addEventListener('click', next);
  if(idx>0){
    document.getElementById('prevbtn').addEventListener('click', prev);
  }
}

function prev(){
  if(idx>0){
    clearAutoAdvance();
    idx--;
    render();
  }
}

let autoTimer = null, countdownTimer = null;
const DOCH_RULE = "Règle : on utilise « doch » (et non « ja ») pour contredire une question ou une affirmation formulée à la négative.";

function showFeedback(ok, correctText, q){
  const fb = document.getElementById('fb');
  fb.className = 'feedback show ' + (ok?'ok':'bad');
  let html = ok ? `<b>✓ Richtig!</b>` : `<b>✗ Presque.</b> Réponse correcte : <b>${correctText}</b>`;
  if(q && q.tr){
    html += `<br><span class="meaning">Signification : ${q.tr}</span>`;
  }
  const isDochMiss = !ok && q && norm(q.answer)==="doch";
  if(isDochMiss){
    html += `<br><span class="meaning">${DOCH_RULE}</span>`;
  }
  fb.innerHTML = html;
  document.getElementById('nextbtn').classList.add('show');
  startAutoAdvance(isDochMiss ? 10 : 2);
}

function startAutoAdvance(DELAY){
  DELAY = DELAY || 4; // secondes avant la question suivante
  let remaining = DELAY;
  const cd = document.getElementById('countdown');
  cd.textContent = `Suite dans ${remaining}s…`;
  clearInterval(countdownTimer); clearTimeout(autoTimer);
  countdownTimer = setInterval(()=>{
    remaining--;
    if(remaining>0 && cd) cd.textContent = `Suite dans ${remaining}s…`;
  }, 1000);
  autoTimer = setTimeout(()=>{ clearInterval(countdownTimer); next(); }, DELAY*1000);
}
function clearAutoAdvance(){ clearTimeout(autoTimer); clearInterval(countdownTimer); }

function handleMcq(btn, q){
  if(answered) return;
  answered = true;
  const chosen = btn.textContent;
  const ok = chosen === q.answer;
  if(ok) score++; else wrongIdx.add(idx);
  card.querySelectorAll('.qopt').forEach(o=>{
    o.disabled = true;
    if(o.textContent === q.answer) o.classList.add('correct');
    else if(o===btn) o.classList.add('incorrect');
  });
  scoreEl.textContent = score;
  showFeedback(ok, q.answer, q);
}

function handleText(val, q){
  if(answered) return;
  answered = true;
  const ok = norm(val) === norm(q.answer) || (q.alt && q.alt.some(a=>norm(val)===norm(a)));
  if(ok) score++; else wrongIdx.add(idx);
  document.getElementById('tin').disabled = true;
  document.getElementById('checkbtn').disabled = true;
  scoreEl.textContent = score;
  showFeedback(ok, q.answer, q);
}

function next(){
  clearAutoAdvance();
  if(idx < questions.length-1){
    const finishedPart = (idx+1) % partSize === 0;
    idx++;
    if(finishedPart){
      showPartBreak();
    } else {
      render();
    }
  } else {
    finish();
  }
  }
function showPartBreak(){
  updateRail();
  const totalParts = Math.ceil(questions.length/partSize);
  const partDone = idx/partSize; // partie qui vient de se terminer
  completedParts.add(partDone-1);
  const pct = Math.round((score/idx)*100);
  card.innerHTML = `<div class="done-screen">
    <div class="big">${partDone}/${totalParts}</div>
    <p>Partie ${partDone} terminée — Score cumulé : ${score}/${idx} (${pct}%)</p>
    <button class="restart" id="continuePartBtn">Continuer →</button>
    <button class="restart" id="prevPartBtn">← Précédent</button>
    <button class="menubtn" id="qzMidHome">☰ Retour à l'accueil</button>
  </div>`;
  document.getElementById('continuePartBtn').addEventListener('click', render);
  document.getElementById('prevPartBtn').addEventListener('click', prev);
  document.getElementById('qzMidHome').addEventListener('click', goHome);
}

function restartQuiz(){
  clearAutoAdvance();
  idx=0; score=0; wrongIdx.clear(); completedParts=new Set();
  questions = shuffleCopy(mode==='standard' ? standardQuestions : hardBank);
  partSize = Math.max(1, Math.ceil(questions.length/10));
  buildRail(); render();
}

function finish(){
  updateRail();
  completedParts.add(Math.floor((idx)/partSize));
  const pct = Math.round((score/questions.length)*100);
  let msg = "Weiter so! Continue à réviser.";
  if(pct>=90) msg="Ausgezeichnet! Ces bases sont solides.";
  else if(pct>=70) msg="Sehr gut! Encore un peu de pratique sur les points ratés.";
  else if(pct>=50) msg="Gut. Revois les catégories où tu as trébuché.";
  card.innerHTML = `<div class="done-screen">
    <div class="big">${score}/${questions.length}</div>
    <p>${pct}% de bonnes réponses — ${msg}</p>
    <button class="restart" id="restartbtn">Recommencer</button>
    <button class="menubtn" id="qzHomeBtn2">☰ Retour à l'accueil</button>
  </div>`;
  document.getElementById('restartbtn').addEventListener('click', restartQuiz);
  document.getElementById('qzHomeBtn2').addEventListener('click', goHome);
}

document.getElementById('qzRestartInlineBtn').addEventListener('click', ()=>{
  if(confirm('Recommencer le quiz depuis le début ?')) restartQuiz();
});

scorebarWrap.style.display='none';
rail.style.display='none';

window.QuizApp = { start: startMode };

})();

showMenu();
</script>
