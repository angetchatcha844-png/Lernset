    function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

    function pickOther(list, exclude, field, keyField = "de") {
      const pool = list.filter(x => x[keyField] !== exclude[keyField]);
      return pool[Math.floor(Math.random() * pool.length)][field];
    }

    function pickOthers(list, exclude, field, count, keyField = "de") {
      const pool = shuffle(list.filter(x => x[keyField] !== exclude[keyField]));
      const seen = new Set();
      const result = [];
      for (const item of pool) {
        if (result.length >= count) break;
        if (!seen.has(item[field])) { seen.add(item[field]);
          result.push(item[field]); }
      }
      return result;
    }

    function normalize(str) { return (str || "").trim().toLowerCase(); }

    function normalizeEszett(s) { return s.replace(/ß/g, "ss"); }

      const t = normalizeEszett(text);
      const k = normalizeEszett(keyword.trim());
      const escaped = k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/\s+/g, "\\s+");

    function buildLesson4() {
      const articleMcqExercises = FURNITURE_GENDER.map(f => ({
        type: "mcq",
        prompt: `Quel article correspond à « ${f.noun} » ?`,
        options: shuffle([
          { text: f.article, correct: true },
          ...["der", "das", "die"].filter(a => a !== f.article).map(a => ({ text: a, correct: false })),
        ]),
        explanation: `« ${f.noun} » est ${f.article === "die" ? "féminin" : f.article === "das" ? "neutre" : "masculin"} : « ${f.article} ${f.noun} ».`,
      }));

      const contextFillExercises = shuffle(FURNITURE_GENDER).slice(0, 15).map(f => {
        const adj = CONTEXT_ADJ[Math.floor(Math.random() * CONTEXT_ADJ.length)];
        return {
          type: "fill_blank",
          prompt: `___ ${f.noun} ist ${adj}.`,
          accepted: [f.article],
          translation: `${capitalize(FURNITURE_FR[f.noun])} est ${ADJ_FR[adj]}.`,
          explanation: `« ${f.noun} » se combine avec l'article « ${f.article} » : ${f.article} ${f.noun} ist ${adj}.`,
        };
      });

      const pluralExercises = shuffle(FURNITURE_GENDER).slice(0, 10).map(f => ({
        type: "mcq",
        prompt: `Quel article utilise-t-on au pluriel pour « ${f.plural} » (pluriel de « ${f.noun} ») ?`,
        options: shuffle([{ text: "die", correct: true }, { text: "der", correct: false }, { text: "das",
            correct: false }]),
        explanation: `Au pluriel, l'article est toujours « die », quel que soit le genre au singulier : die ${f.plural}.`,
      }));

      const priceExercises = shuffle(FURNITURE_GENDER).slice(0, 5).map(f => ({
        type: "fill_blank",
        prompt: `Wie viel kostet ___ ${f.noun}?`,
        accepted: [f.article],
        translation: `Combien coûte ${FURNITURE_FR[f.noun]} ?`,
        explanation: `On utilise l'article défini du nom : Wie viel kostet ${f.article} ${f.noun}?`,
      }));

      const grammarExercises = shuffle([...articleMcqExercises, ...contextFillExercises, ...pluralExercises,
        ...priceExercises
      ]);

      const FURNITURE_VOCAB = FURNITURE_GENDER.map(f => ({ de: `${f.article} ${f.noun}`, fr: FURNITURE_FR[f.noun] }));
      const furnitureExercises = FURNITURE_VOCAB.map(f => ({
        type: "mcq",
        prompt: `Comment dit-on « ${f.fr} » en allemand ?`,
        options: shuffle([{ text: f.de, correct: true }, { text: pickOther(FURNITURE_VOCAB, f, "de"), correct: false },
        { text: pickOther(FURNITURE_VOCAB, f, "de"), correct: false }]),
        explanation: `${f.fr} se dit « ${f.de} » en allemand.`,
      }));

      const shoppingExercises = SHOPPING_WORDS.map(s => ({
        type: "mcq",
        prompt: `Que signifie « ${s.de} » ?`,
        options: shuffle([{ text: s.fr, correct: true }, { text: pickOther(SHOPPING_WORDS, s, "fr"), correct: false },
        { text: pickOther(SHOPPING_WORDS, s, "fr"), correct: false }]),
        explanation: `« ${s.de} » = ${s.fr}`,
      }));

      const adjectiveExercises = SHOPPING_ADJ.map(a => ({
        type: "mcq",
        prompt: `Que signifie « ${a.de} » ?`,
        options: shuffle([{ text: a.fr, correct: true }, { text: pickOther(SHOPPING_ADJ, a, "fr"), correct: false },
        { text: pickOther(SHOPPING_ADJ, a, "fr"), correct: false }]),
        explanation: `« ${a.de} » = ${a.fr}`,
      }));

      const numberExercises = NUMBERS_TENS.map(n => ({
        type: "mcq",
        prompt: `Comment dit-on « ${n.fr} » en allemand ?`,
        options: shuffle([{ text: n.de, correct: true }, { text: pickOther(NUMBERS_TENS, n, "de"), correct: false },
        { text: pickOther(NUMBERS_TENS, n, "de"), correct: false }]),
        explanation: `« ${n.fr} » se dit « ${n.de} » en allemand.`,
      }));

      const vocabExercises = shuffle([...furnitureExercises, ...shoppingExercises, ...adjectiveExercises,
        ...numberExercises
      ]);

      const comprehensionExercises = DIALOGUES_4.flatMap((d, di) => d.qs.map(q => ({ ...q, translation: q.tr,
        dialogueIndex: di, dialogueText: d.text })));

      return {
        number: 4,
        title: "Achats, meubles",
        theme: "Meubles, magasin, prix",
        grammarFocus: "Article défini der/das/die",
        sections: {
          grammar: {
            label: "Grammaire",
            intro: `20 meubles répartis entre der/das/die + usage en contexte (phrase, pluriel toujours « die », prix). ${grammarExercises.length} questions, réparties en ${Math.ceil(grammarExercises.length / 10)} lots de 10.`,
            tip: "Retiens surtout la règle sans exception : au pluriel, c'est TOUJOURS « die », quel que soit le genre au singulier (der Tisch → die Tische, das Bett → die Betten). C'est le raccourci le plus rentable de cette leçon.",
            exercises: grammarExercises,
          },
          vocab: {
            label: "Vocabulaire",
            intro: `Vocabulaire enrichi au-delà de Menschen : 20 meubles, 10 mots liés aux achats, 10 adjectifs descriptifs, et des nombres composés de 20 à 1000. ${vocabExercises.length} questions, réparties en ${Math.ceil(vocabExercises.length / 10)} lots de 10.`,
            tip: "Regroupe mentalement les meubles par pièce (cuisine, salon, chambre) plutôt que dans l'ordre de la liste : ça crée des images mentales beaucoup plus faciles à retenir qu'une liste brute.",
            exercises: vocabExercises,
          },
          comprehension: {
            label: "Compréhension",
            intro: "5 dialogues originaux en magasin de meubles, avec des prix à comprendre. 10 questions par dialogue, 50 au total.",
            tip: "Les prix sont presque toujours la clé des questions : dès que tu vois un chiffre suivi de « Euro » dans le dialogue, note-le mentalement, il y a de fortes chances qu'on te le redemande.",
            exercises: comprehensionExercises,
          },
          writing: {
            label: "Production écrite",
            intro: "10 mini-tâches guidées, avec un focus sur les articles définis et le vocabulaire des achats.",
            tip: "Pour demander un prix, la structure est toujours la même : « Wie viel kostet + article + nom ? ». Apprends cette phrase par cœur, elle marche pour n'importe quel objet.",
            tasks: WRITING_TASKS_4,
          },
        },
      };
    }

    function buildLesson5() {
      function einEineForm(o) { return o.article === "die" ? "eine" : "ein"; }

      function otherEinEine(o) { return o.article === "die" ? "ein" : "eine"; }

      function keinKeineForm(o) { return o.article === "die" ? "keine" : "kein"; }

      function otherKeinKeine(o) { return o.article === "die" ? "kein" : "keine"; }

      function genderLabel(o) { return o.article === "die" ? "féminin" : o.article === "das" ? "neutre" : "masculin"; }

      const einEineMcqExercises = OBJECTS_GENDER.map(o => ({
        type: "mcq",
        prompt: `Quel article indéfini correspond à « ${o.noun} » ?`,
        options: shuffle([{ text: einEineForm(o), correct: true }, { text: otherEinEine(o), correct: false }]),
        explanation: `« ${o.noun} » est ${genderLabel(o)} (${o.article} ${o.noun}) → on utilise « ${einEineForm(o)} ».`,
      }));

      const keinKeineMcqExercises = shuffle(OBJECTS_GENDER).slice(0, 10).map(o => ({
        type: "mcq",
        prompt: `Quelle est la forme négative de « ${einEineForm(o)} ${o.noun} » ?`,
        options: shuffle([{ text: `${keinKeineForm(o)} ${o.noun}`, correct: true }, { text: `${otherKeinKeine(o)} ${o.noun}`,
            correct: false }]),
        explanation: `« ${o.noun} » est ${genderLabel(o)} → la négation de « ${einEineForm(o)} ${o.noun} » est « ${keinKeineForm(o)} ${o.noun} ».`,
      }));

      const contextFillEinEine = shuffle(OBJECTS_GENDER).slice(0, 10).map(o => ({
        type: "fill_blank",
        prompt: `Ich habe ___ ${o.noun}.`,
        accepted: [einEineForm(o)],
        translation: `J'ai ${o.frIndef}.`,
        explanation: `« ${o.noun} » est ${genderLabel(o)} → « ${einEineForm(o)} ${o.noun} ».`,
      }));

      const KEIN_NICHT_ITEMS = [
        { prompt: "Ich habe ___ Buch.", answer: "kein",
          explanation: "On nie ici le nom « Buch », sans article défini ni possessif → « kein », pas « nicht »." },
        { prompt: "Das Buch ist ___ neu, es ist alt.", answer: "nicht",
          explanation: "On ne nie pas un nom mais l'adjectif « neu » → « nicht », pas « kein/keine »." },
        { prompt: "Ich habe ___ Uhr.", answer: "keine",
          explanation: "« Uhr » est féminin et sans article défini → « keine », pas « nicht »." },
        { prompt: "Er kommt heute ___.", answer: "nicht",
          explanation: "On nie ici le verbe « kommen » (toute la phrase), pas un nom → « nicht »." },
        { prompt: "Wir haben ___ Rucksack.", answer: "kein",
          explanation: "« Rucksack » est un nom sans article défini ni possessif → « kein », pas « nicht »." },
        { prompt: "Das ist ___ meine Tasche, sondern seine.", answer: "nicht",
          explanation: "Devant un nom précédé d'un possessif (« meine Tasche »), on utilise « nicht », jamais « kein/keine »." },
        { prompt: "Ich habe heute ___ Zeit.", answer: "keine",
          explanation: "« Zeit » est féminin et sans article défini → « keine », pas « nicht »." },
        { prompt: "Der Rucksack ist ___ teuer, er ist billig.", answer: "nicht",
          explanation: "On nie ici l'adjectif « teuer », pas un nom → « nicht »." },
        { prompt: "Ich sehe hier ___ Computer.", answer: "kein",
          explanation: "« Computer » est un nom sans article défini ni possessif → « kein », pas « nicht »." },
        { prompt: "Ich verstehe das ___.", answer: "nicht",
          explanation: "On nie ici le verbe « verstehen », pas un nom → « nicht »." },
      ];
      const keinVsNichtExercises = KEIN_NICHT_ITEMS.map(item => ({
        type: "mcq",
        prompt: `Complète : « ${item.prompt} »`,
        options: shuffle([{ text: item.answer, correct: true }, { text: item.answer === "nicht" ? "kein/keine" :
            "nicht", correct: false }]),
        explanation: item.explanation,
      }));
      
      const grammarExercises = shuffle([...einEineMcqExercises, ...keinKeineMcqExercises, ...contextFillEinEine,
        ...keinVsNichtExercises
      ]);

      const OBJECTS_VOCAB = OBJECTS_GENDER.map(o => ({ de: `${o.article} ${o.noun}`, fr: o.frDef }));
      const objectsExercises = OBJECTS_VOCAB.map(o => ({
        type: "mcq",
        prompt: `Comment dit-on « ${o.fr} » en allemand ?`,
        options: shuffle([{ text: o.de, correct: true }, ...pickOthers(OBJECTS_VOCAB, o, "de", 2).map(t => ({ text: t,
            correct: false }))]),
        explanation: `${o.fr} se dit « ${o.de} » en allemand.`,
      }));

      const verbsExercises = VERBS_OBJECTS.map(v => ({
        type: "mcq",
        prompt: `Que signifie « ${v.de} » ?`,
        options: shuffle([{ text: v.fr, correct: true }, ...pickOthers(VERBS_OBJECTS, v, "fr", 2).map(t => ({ text: t,
            correct: false }))]),
        explanation: `« ${v.de} » = ${v.fr}`,
      }));

      const adjectivesExercises = OBJECT_ADJ.map(a => ({
        type: "mcq",
        prompt: `Que signifie « ${a.de} » ?`,
        options: shuffle([{ text: a.fr, correct: true }, ...pickOthers(OBJECT_ADJ, a, "fr", 2).map(t => ({ text: t,
            correct: false }))]),
        explanation: `« ${a.de} » = ${a.fr}`,
      }));

      const descriptionExercises = OBJECT_DESCRIPTION.map(d => ({
        type: "mcq",
        prompt: `Que signifie « ${d.de} » ?`,
        options: shuffle([{ text: d.fr, correct: true }, ...pickOthers(OBJECT_DESCRIPTION, d, "fr", 2).map(t => ({ text: t,
            correct: false }))]),
        explanation: `« ${d.de} » = ${d.fr}`,
      }));

      const vocabExercises = shuffle([...objectsExercises, ...verbsExercises, ...adjectivesExercises,
        ...descriptionExercises
      ]);

      const comprehensionExercises = DIALOGUES_5.flatMap((d, di) => d.qs.map(q => ({ ...q, translation: q.tr,
        dialogueIndex: di, dialogueText: d.text })));

      return {
        number: 5,
        title: "Objets, produits",
        theme: "Objets du quotidien, produits, cadeaux",
        grammarFocus: "Article indéfini ein/eine, négation kein/keine",
        sections: {
          grammar: {
            label: "Grammaire",
            intro: `20 objets du quotidien avec ein/eine + négation kein/keine en contexte, et la distinction essentielle entre kein/keine et nicht. ${grammarExercises.length} questions, réparties en ${Math.ceil(grammarExercises.length / 10)} lots de 10.`,
            tip: "ein et kein suivent le même accord de genre (masculin/neutre → ein/kein, féminin → eine/keine). Et pour choisir entre kein et nicht : kein/keine nie un nom seul (sans article défini ni possessif) ; nicht nie tout le reste — un verbe, un adjectif, un adverbe, ou un nom déjà précédé d'un article défini ou d'un possessif.",
            exercises: grammarExercises,
          },
          vocab: {
            label: "Vocabulaire",
            intro: `Vocabulaire enrichi au-delà de Menschen : 20 objets du quotidien, 10 verbes usuels, 10 adjectifs d'état, et 10 mots/phrases pour décrire un objet (couleur, forme, matière) et communiquer en classe (demander un mot, demander de répéter, remercier). ${vocabExercises.length} questions, réparties en ${Math.ceil(vocabExercises.length / 10)} lots de 10.`,
            tip: "Associe chaque objet à l'endroit où tu le ranges habituellement (sac, bureau, cuisine) : ça crée des images mentales bien plus solides qu'une liste apprise dans l'ordre.",
            exercises: vocabExercises,
          },
          comprehension: {
            label: "Compréhension",
            intro: "5 dialogues originaux autour d'objets qu'on a, qu'on cherche, qu'on perd ou qu'on offre — et qui mettent en scène les objectifs de communication du manuel (décrire un objet, demander un mot, demander de répéter, remercier). 10 questions par dialogue, 50 au total.",
            tip: "Repère bien QUI a quoi, et QUI n'a PAS quoi : les dialogues jouent beaucoup sur l'opposition ein/kein entre les personnages.",
            exercises: comprehensionExercises,
          },
          writing: {
            label: "Production écrite",
            intro: "10 mini-tâches guidées, avec un focus sur l'article indéfini et la négation kein/keine.",
            tip: "Pense ein/kein comme une paire d'opposés : pour chaque phrase avec « ein/eine », essaie aussi de la reformuler avec « kein/keine ».",
            tasks: WRITING_TASKS_5,
          },
        },
      };
    }

    function buildLesson6() {
      function randomVerb(n) { const list = VERBS_BY_CATEGORY[n.category]; return list[Math.floor(Math.random() * list
          .length)]; }

      function frSentence(verb, n) {
        const vfr = VERB_FR[verb];
        const subject = /^[aeiouéèêh]/i.test(vfr) ? "J'" : "Je ";
        return `${subject}${vfr} ${n.frIndef}.`;
      }

      function akkArticle(n, kind) {
        if (n.gender === "der") return kind === "def" ? "den" : kind === "indef" ? "einen" : "keinen";
        if (n.gender === "das") return kind === "def" ? "das" : kind === "indef" ? "ein" : "kein";
        return kind === "def" ? "die" : kind === "indef" ? "eine" : "keine";
      }

      function nomArticle(n, kind) {
        if (kind === "def") return n.gender;
        if (kind === "indef") return n.gender === "die" ? "eine" : "ein";
        return n.gender === "die" ? "keine" : "kein";
      }

      function genderLabel(n) { return n.gender === "die" ? "féminin" : n.gender === "das" ? "neutre" : "masculin"; }

      function genderLabelUpper(n) { return n.gender === "die" ? "FÉMININ" : n.gender === "das" ? "NEUTRE" : "MASCULIN"; }

      const akkusativDefiniteMcq = shuffle(NOUNS_L6).map(n => {
        const verb = randomVerb(n);
        const correct = akkArticle(n, "def");
        const wrong = nomArticle(n, "def") === correct ? "den" : nomArticle(n, "def");
        return {
          type: "mcq",
          prompt: `Complète : « Ich ${verb} ___ ${n.noun}. » (${n.noun} est ${genderLabelUpper(n)})`,
          options: shuffle([{ text: correct, correct: true }, { text: wrong, correct: false }]),
          translation: frSentence(verb, n),
          explanation: n.gender === "der" ?
            `« ${n.noun} » est masculin et complément d'objet direct → « der » devient « den ».` :
            `« ${n.noun} » est ${genderLabel(n)} → à l'accusatif, l'article ne change PAS (seul le masculin change).`,
        };
      });

      const akkusativIndefiniteMcq = shuffle(NOUNS_L6).slice(0, 15).map(n => {
        const verb = randomVerb(n);
        const correct = akkArticle(n, "indef");
        const wrong = nomArticle(n, "indef") === correct ? "einen" : nomArticle(n, "indef");
        return {
          type: "mcq",
          prompt: `Complète : « Ich ${verb} ___ ${n.noun}. » (${n.noun} est ${genderLabelUpper(n)})`,
          options: shuffle([{ text: correct, correct: true }, { text: wrong, correct: false }]),
          translation: frSentence(verb, n),
          explanation: n.gender === "der" ?
            `« ${n.noun} » est masculin et complément d'objet direct → « ein » devient « einen ».` :
            `« ${n.noun} » est ${genderLabel(n)} → « ${correct} » ne change pas à l'accusatif.`,
        };
      });

      const akkusativKeinMcq = shuffle(NOUNS_L6).slice(0, 10).map(n => {
        const correct = akkArticle(n, "kein");
        const wrong = nomArticle(n, "kein") === correct ? "keinen" : nomArticle(n, "kein");
        return {
          type: "mcq",
          prompt: `Complète : « Ich möchte ___ ${n.noun}. » (${n.noun} est ${genderLabelUpper(n)})`,
          options: shuffle([{ text: correct, correct: true }, { text: wrong, correct: false }]),
          translation: `Je ne voudrais pas de ${n.frBare}.`,
          explanation: n.gender === "der" ?
            `« ${n.noun} » est masculin et complément d'objet direct → « kein » devient « keinen ».` :
            `« ${n.noun} » est ${genderLabel(n)} → « ${correct} » ne change pas à l'accusatif.`,
        };
      });

      const WER_WEN_ITEMS = [
        { prompt: "___ siehst du dort?", answer: "Wen", tr: "Qui vois-tu là-bas ?" },
        { prompt: "___ kommt heute Abend?", answer: "Wer", tr: "Qui vient ce soir ?" },
        { prompt: "___ hast du im Restaurant getroffen?", answer: "Wen", tr: "Qui as-tu rencontré au restaurant ?" },
        { prompt: "___ ist das?", answer: "Wer", tr: "Qui est-ce ?" },
        { prompt: "___ fragst du?", answer: "Wen", tr: "À qui poses-tu la question ?" },
        { prompt: "___ arbeitet hier?", answer: "Wer", tr: "Qui travaille ici ?" },
        { prompt: "___ liebst du?", answer: "Wen", tr: "Qui aimes-tu ?" },
        { prompt: "___ hat den Kuchen gemacht?", answer: "Wer", tr: "Qui a fait le gâteau ?" },
        { prompt: "___ besuchst du morgen?", answer: "Wen", tr: "Qui rends-tu visite demain ?" },
        { prompt: "___ wohnt in Berlin?", answer: "Wer", tr: "Qui habite à Berlin ?" },
        { prompt: "___ bedient dich im Restaurant?", answer: "Wer", tr: "Qui te sert au restaurant ?" },
        { prompt: "___ fragst du nach der Rechnung?", answer: "Wen", tr: "À qui demandes-tu l'addition ?" },
        { prompt: "___ kauft die Jacke?", answer: "Wer", tr: "Qui achète la veste ?" },
        { prompt: "___ siehst du im Geschäft?", answer: "Wen", tr: "Qui vois-tu dans le magasin ?" },
        { prompt: "___ übernimmt die Rechnung?", answer: "Wer", tr: "Qui prend en charge l'addition ?" },
      ];
      const werWenMcq = WER_WEN_ITEMS.map(item => ({
        type: "mcq",
        prompt: `Complète : « ${item.prompt} »`,
        options: shuffle([{ text: item.answer, correct: true }, { text: item.answer === "Wer" ? "Wen" : "Wer",
            correct: false }]),
        translation: item.tr,
        explanation: item.answer === "Wer" ?
          "« Wer » interroge sur le SUJET de la phrase (celui qui fait l'action)." :
          "« Wen » interroge sur le COMPLÉMENT D'OBJET DIRECT (celui qui subit l'action).",
      }));

      const pluralFillBlank = shuffle(NOUNS_L6).slice(0, 10).map(n => ({
        type: "fill_blank",
        prompt: `Quel est le pluriel de « ${n.gender} ${n.noun} » (${genderLabelUpper(n)}) ? Complète : die ___.`,
        accepted: [n.plural],
        translation: `Pluriel de « ${n.frDef} ».`,
        explanation: `Le pluriel de « ${n.gender} ${n.noun} » est « die ${n.plural} ».`,
      }));

      const grammarExercises = shuffle([...akkusativDefiniteMcq, ...akkusativIndefiniteMcq, ...akkusativKeinMcq,
        ...werWenMcq, ...pluralFillBlank
      ]);

      const foodExercises = FOOD_VOCAB.map(f => ({
        type: "mcq",
        prompt: `Comment dit-on « ${f.fr} » en allemand ?`,
        options: shuffle([{ text: f.de, correct: true }, ...pickOthers(FOOD_VOCAB, f, "de", 2).map(t => ({ text: t,
            correct: false }))]),
        explanation: `${f.fr} se dit « ${f.de} » en allemand.`,
      }));

      const clothingExercises = CLOTHING_VOCAB.map(c => ({
        type: "mcq",
        prompt: `Comment dit-on « ${c.fr} » en allemand ?`,
        options: shuffle([{ text: c.de, correct: true }, ...pickOthers(CLOTHING_VOCAB, c, "de", 2).map(t => ({ text: t,
            correct: false }))]),
        explanation: `${c.fr} se dit « ${c.de} » en allemand.`,
      }));

      const verbsExercises = VERBS_L6.map(v => ({
        type: "mcq",
        prompt: `Que signifie « ${v.de} » ?`,
        options: shuffle([{ text: v.fr, correct: true }, ...pickOthers(VERBS_L6, v, "fr", 2).map(t => ({ text: t,
            correct: false }))]),
        explanation: `« ${v.de} » = ${v.fr}`,
      }));

      const adjectivesExercises = ADJ_L6.map(a => ({
        type: "mcq",
        prompt: `Que signifie « ${a.de} » ?`,
        options: shuffle([{ text: a.fr, correct: true }, ...pickOthers(ADJ_L6, a, "fr", 2).map(t => ({ text: t,
            correct: false }))]),
        explanation: `« ${a.de} » = ${a.fr}`,
      }));

      const vocabExercises = shuffle([...foodExercises, ...clothingExercises, ...verbsExercises, ...adjectivesExercises]);

      const comprehensionExercises = DIALOGUES_6.flatMap((d, di) => d.qs.map(q => ({ ...q, translation: q.tr,
        dialogueIndex: di, dialogueText: d.text })));

      return {
        number: 6,
        title: "Au restaurant, les vêtements",
        theme: "Nourriture, restaurant, vêtements, achats",
        grammarFocus: "Accusatif (der→den, ein→einen, kein→keinen), wer/wen, pluriel des noms",
        sections: {
          grammar: {
            label: "Grammaire",
            intro: `L'accusatif (COD) : seul le masculin change (der→den, ein→einen, kein→keinen), le neutre et le féminin restent identiques. Plus la distinction wer/wen et le pluriel des noms. ${grammarExercises.length} questions, réparties en ${Math.ceil(grammarExercises.length / 10)} lots de 10.`,
            tip: "Règle d'or de l'accusatif : SEUL le masculin change (der→den, ein→einen, kein→keinen). Le neutre et le féminin sont identiques au nominatif et à l'accusatif — ne les modifie pas par réflexe !",
            exercises: grammarExercises,
          },
          vocab: {
            label: "Vocabulaire",
            intro: `Vocabulaire enrichi au-delà de Menschen : 15 mots de nourriture, 15 vêtements, 10 verbes usuels (essen, bestellen, tragen...) et 10 adjectifs pour décrire un plat ou un vêtement. ${vocabExercises.length} questions, réparties en ${Math.ceil(vocabExercises.length / 10)} lots de 10.`,
            tip: "Associe chaque mot à une scène concrète : un plat que tu commanderais au restaurant, ou un vêtement que tu porterais. Les images mentales concrètes s'ancrent mieux que les listes.",
            exercises: vocabExercises,
          },
          comprehension: {
            label: "Compréhension",
            intro: "5 dialogues originaux : commander au restaurant, essayer des vêtements, une question wer/wen, des achats au marché, et payer l'addition. 10 questions par dialogue, 50 au total.",
            tip: "Repère bien qui fait l'action (sujet, wer) et qui la subit (complément, wen) : c'est la clé pour comprendre ces dialogues comme pour répondre aux questions grammaticales.",
            exercises: comprehensionExercises,
          },
          writing: {
            label: "Production écrite",
            intro: "10 mini-tâches guidées, avec un focus sur l'accusatif et le pluriel en contexte de restaurant et de shopping.",
            tip: "Avant d'écrire, demande-toi : est-ce que le mot que j'utilise est complément d'objet direct ? Si oui, et s'il est masculin, n'oublie pas le « -en » (der→den, ein→einen).",
            tasks: WRITING_TASKS_6,
          },
        },
      };
    }

    // ================================================================
    //  MOTEUR DE L'APPLICATION
    // ================================================================
    const LESSON_BUILDERS = { 4: buildLesson4, 5: buildLesson5, 6: buildLesson6 };
    const SECTION_ORDER = ["grammar", "vocab", "comprehension", "writing"];
    const ICONS = { grammar: "📚", vocab: "📖", comprehension: "💬", writing: "✍️" };
    const BATCH_SIZE = 10;
    
    let currentLessonKey = 4;
    let lessonData = LESSON_BUILDERS[4]();

    let state = {
      view: "menu",
      activeSection: null,
      progress: {
        grammar: { answeredCount: 0, correctCount: 0 },
        vocab: { answeredCount: 0, correctCount: 0 },
        comprehension: { answeredCount: 0, correctCount: 0 },
        writing: { answeredCount: 0, correctCount: 0 },
      },
      quiz: { index: 0, answer: null, validated: false, stage: "question", batchCorrect: 0, batchAnswered: 0 },
      writing: { index: 0, text: "", validated: false, finished: false },
    };

    function sectionTotal(key) {
      if (key === "writing") return lessonData.sections[key].tasks.length;
      return lessonData.sections[key].exercises.length;
    }

    function sectionStatus(key) {
      const p = state.progress[key];
      const total = sectionTotal(key);
      if (p.answeredCount === 0) return "not_started";
      if (p.answeredCount >= total) return "completed";
      return "in_progress";
    }

    function overallScore() {
      let sum = 0;
      SECTION_ORDER.forEach(key => {
        const total = sectionTotal(key);
        const p = state.progress[key];
        let pct = 0;
        if (key === "writing") pct = total > 0 ? p.correctCount / total : 0;
        else pct = total > 0 ? (p.correctCount / total) * 100 : 0;
        sum += pct * 0.3;
      });
      return sum;
    }

    function resetState() {
      state.view = "menu";
      state.activeSection = null;
      state.progress = {
        grammar: { answeredCount: 0, correctCount: 0 },
        vocab: { answeredCount: 0, correctCount: 0 },
        comprehension: { answeredCount: 0, correctCount: 0 },
        writing: { answeredCount: 0, correctCount: 0 },
      };
      state.quiz = { index: 0, answer: null, validated: false, stage: "question", batchCorrect: 0, batchAnswered: 0 };
      state.writing = { index: 0, text: "", validated: false, finished: false };
    }

    function switchLesson(key) {
      currentLessonKey = key;
      lessonData = LESSON_BUILDERS[key]();
      resetState();
      render();
    }

    // ================================================================
    //  RENDU
    // ================================================================
    const root = document.getElementById('root');

    function render() {
      let html = `<div class="app">`;

      // En-tête + sélecteur de leçon
      html += `
        <div class="mb-4">
          <div class="flex items-center gap-2 mb-1">
            <span class="px-2 py-0.5 rounded border-2 text-[11px] font-bold" style="border-color:${COLORS.gold};color:${COLORS.ink};font-family:'Fraunces',serif;">A1</span>
            <span class="text-[11px] font-semibold uppercase tracking-widest" style="color:${COLORS.gold};font-family:'IBM Plex Sans',sans-serif;">Leçon ${lessonData.number}</span>
          </div>
          <h1 class="header-title">${lessonData.title}</h1>
          <p class="header-sub">${lessonData.theme}, ${lessonData.grammarFocus}</p>
        </div>
      `;

      // Onglets de sélection
      html += `<div class="lesson-tabs">`;
      [4, 5, 6].forEach(num => {
        const active = num === currentLessonKey ? 'active' : '';
        const label = `Leçon ${num}`;
        html += `<button class="lesson-tab ${active}" data-lesson="${num}">${label}</button>`;
      });
      html += `</div>`;

      // Score global
      const score = Math.round(overallScore());
      html += `
        <div class="bg-ink">
          <div class="score-circle">${score}%</div>
          <div><div class="label">Score de maîtrise global</div></div>
        </div>
      `;

      html += `<div class="card">`;

      if (state.view === "menu") html += renderMenu();
      else if (state.view === "intro") html += renderIntro();
      else if (state.view === "quiz") {
        if (state.activeSection === "writing") html += renderWriting();
        else html += renderQuiz();
      }

      html += `</div></div>`;
      root.innerHTML = html;
      attachEvents();
    }

    // ----- MENU -----
    function renderMenu() {
      let html = `<div class="space-y-3">`;
      SECTION_ORDER.forEach(key => {
        const total = sectionTotal(key);
        const status = sectionStatus(key);
        let badgeClass = "badge",
          badgeLabel = "à faire";
        if (status === "in_progress") { badgeClass += " in-progress";
          badgeLabel = "en cours"; } else if (status === "completed") { badgeClass += " completed";
          badgeLabel = "terminé"; }
        html += `
          <button class="section-button" data-section="${key}">
            <div class="icon-circle"><span style="font-size:18px;">${ICONS[key]}</span></div>
            <div class="info">
              <div class="title">${lessonData.sections[key].label}</div>
              <div class="sub">${total} ${key === "writing" ? "tâches" : "questions"} · ${Math.ceil(total / 10)} lot${Math.ceil(total / 10) > 1 ? "s" : ""}</div>
            </div>
            <span class="${badgeClass}">${badgeLabel}</span>
          </button>
        `;
      });
      html += `</div>`;
      return html;
    }

    // ----- INTRO -----
    function renderIntro() {
      const key = state.activeSection;
      const section = lessonData.sections[key];
      const p = state.progress[key];
      const total = sectionTotal(key);
      const isStarted = p.answeredCount > 0 && p.answeredCount < total;
      const btnLabel = isStarted ? "Continuer" : "Commencer";
      return `
        <div class="flex items-center gap-2 mb-4">
          <span style="font-size:20px;">${ICONS[key]}</span>
          <h2 class="text-[19px] font-semibold" style="color:${COLORS.ink};font-family:'Fraunces',serif;">${section.label}</h2>
        </div>
        <div class="p-4 rounded-xl mb-3" style="background:${COLORS.cream};border:1px solid ${COLORS.border};">
          <p style="font-size:14px;line-height:1.6;color:#44412F;">${section.intro}</p>
        </div>
        ${section.tip ? `<div class="tip-box"><span class="icon">💡</span><div><div class="label">Astuce</div><p>${section.tip}</p></div></div>` : ''}
        <div class="flex gap-2">
          <button class="btn-secondary" data-action="back-to-menu">Retour</button>
          <button class="btn-primary flex-1" data-action="start-quiz">${btnLabel} →</button>
        </div>
      `;
    }

    // ----- QUIZ -----
    function renderQuiz() {
      const key = state.activeSection;
      const section = lessonData.sections[key];
      const exercises = section.exercises;
      const total = exercises.length;
      const totalBatches = Math.ceil(total / BATCH_SIZE);
      const q = state.quiz;

      if (q.stage === "sectionDone") {
        const scorePct = total > 0 ? Math.round((state.progress[key].correctCount / total) * 100) : 0;
        return `
          <div class="text-center py-4">
            <div class="flex justify-center mb-4">${gaugeHTML(total, total, 96)}</div>
            <h3 class="text-[20px] font-semibold" style="color:${COLORS.ink};font-family:'Fraunces',serif;">Section terminée</h3>
            <p class="text-[15px] mb-1">Score : <span class="font-semibold">${scorePct}%</span> (${state.progress[key].correctCount}/${total} bonnes réponses)</p>
            <div class="flex gap-2 justify-center mt-4 flex-wrap">
              <button class="btn-primary" data-action="back-to-menu">Retour aux modules</button>
              <button class="btn-secondary" data-action="restart-section">🔄 Recommencer</button>
            </div>
          </div>
        `;
      }

      if (q.stage === "batchDone") {
        const batchStart = Math.floor(q.index / BATCH_SIZE) * BATCH_SIZE;
        const batchEnd = Math.min(batchStart + BATCH_SIZE, total) - 1;
        const batchNum = Math.floor(q.index / BATCH_SIZE) + 1;
        const isLastBatch = batchEnd + 1 >= total;
        const batchPct = q.batchAnswered > 0 ? Math.round((q.batchCorrect / q.batchAnswered) * 100) : 0;
        return `
          <div class="text-center py-4">
            <div class="flex justify-center mb-4">${gaugeHTML(BATCH_SIZE, batchEnd - batchStart + 1, 96)}</div>
            <h3 class="text-[20px] font-semibold" style="color:${COLORS.ink};font-family:'Fraunces',serif;">Lot ${batchNum}/${totalBatches} terminé</h3>
            <p class="text-[15px] mb-1">Score de ce lot : <span class="font-semibold">${batchPct}%</span> (${q.batchCorrect}/${q.batchAnswered} bonnes réponses)</p>
            <div class="flex flex-wrap gap-2 justify-center mt-4">
              <button class="btn-secondary" data-action="back-to-menu">Retour aux modules</button>
              <button class="btn-secondary" data-action="restart-batch">🔄 Recommencer ce lot</button>
              <button class="btn-primary" data-action="${isLastBatch ? 'finish-section' : 'next-batch'}">${isLastBatch ? "Voir mon score" : "Lot suivant"} →</button>
            </div>
          </div>
        `;
      }

      const ex = exercises[q.index];
      const batchStart = Math.floor(q.index / BATCH_SIZE) * BATCH_SIZE;
      const batchEnd = Math.min(batchStart + BATCH_SIZE, total) - 1;
      const batchNum = Math.floor(q.index / BATCH_SIZE) + 1;
      const isComprehension = key === "comprehension";
      const dialogueText = isComprehension ? ex?.dialogueText : null;
      const showDialogue = dialogueText && (q.index === batchStart || exercises[q.index - 1]?.dialogueIndex !== ex
        .dialogueIndex);

      let html = `
        <div class="flex items-center justify-between mb-4">
          <button class="text-sm" style="color:${COLORS.muted};background:none;border:none;cursor:pointer;" data-action="back-to-menu">← Modules</button>
          <span class="text-xs font-semibold uppercase tracking-wide" style="color:${COLORS.gold};">Lot ${batchNum}/${totalBatches}</span>
          <div>${gaugeHTML(batchEnd - batchStart + 1, q.index - batchStart + (q.validated ? 1 : 0), 52)}</div>
        </div>
      `;

      if (showDialogue) html += `<div class="dialogue-box">${dialogueText}</div>`;

      html += `<p class="text-[15.5px] leading-relaxed mb-1">${ex.prompt}</p>`;
      if (q.validated && ex.translation) html += `<p class="text-sm mb-3" style="color:${COLORS.teal};">${ex.translation}</p>`;
      html += renderExerciseBody(ex, q.answer, q.validated);
      if (q.validated && ex.explanation) html +=
        `<p class="text-sm italic mt-3" style="color:${COLORS.muted};">${ex.explanation}</p>`;

      if (!q.validated) {
        html += `<button class="btn-primary w-full mt-4" data-action="validate" ${q.answer === null ? 'disabled' : ''}>Valider</button>`;
      } else {
        html += `<button class="btn-primary w-full mt-4" style="background:${COLORS.ink};" data-action="next-question">${q.index === batchEnd ? "Terminer ce lot" : "Question suivante"} →</button>`;
      }

      return html;
    }

    function renderExerciseBody(ex, answer, validated) {
      if (ex.type === "mcq") {
        let html = `<div class="grid-exercises">`;
        ex.options.forEach((opt, i) => {
          let cls = "option-btn";
          const isSelected = answer === i;
          if (validated) { if (opt.correct) cls += " correct";
            else if (isSelected) cls += " wrong"; } else if (isSelected) cls += " selected";
          const icon = (validated && opt.correct) ? '✅' : (validated && isSelected && !opt.correct) ? '❌' : '';
          html +=
            `<button class="${cls}" data-opt-index="${i}" ${validated ? 'disabled' : ''}><span>${opt.text}</span>${icon ? `<span>${icon}</span>` : ''}</button>`;
        });
        html += `</div>`;
        return html;
      }
      if (ex.type === "fill_blank") {
        const isCorrect = validated && ex.accepted.some(a => normalize(a) === normalize(answer || ""));
        let cls = "input-text";
        if (validated) cls += isCorrect ? " correct" : " wrong";
        return `<input type="text" class="${cls}" value="${answer || ''}" ${validated ? 'disabled' : ''} placeholder="Ta réponse..." data-fill-input />`;
      }
      if (ex.type === "true_false") {
        let html = `<div class="flex gap-2">`;
        [true, false].forEach(val => {
          const label = val ? "Richtig" : "Falsch";
          const isSelected = answer === val;
          let cls = "tf-btn";
          if (validated) { if (val === ex.correct) cls += " correct";
            else if (isSelected) cls += " wrong"; } else if (isSelected) cls += " selected";
          html += `<button class="${cls}" data-tf-value="${val}" ${validated ? 'disabled' : ''}>${label}</button>`;
        });
        html += `</div>`;
        return html;
      }
      return '';
    }

    function gaugeHTML(total, completed, size = 68) {
      const r = (size - 8) / 2;
      const circ = 2 * Math.PI * r;
      const frac = total > 0 ? Math.min(1, completed / total) : 0;
      const offset = circ * (1 - frac);
      return `
        <div class="gauge" style="width:${size}px;height:${size}px;">
          <svg width="${size}" height="${size}">
            <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#E4DECB" stroke-width="6" />
            <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#C9A227" stroke-width="6" stroke-linecap="round"
              stroke-dasharray="${circ}" stroke-dashoffset="${offset}" style="transition:stroke-dashoffset 0.4s ease;" />
          </svg>
          <div class="center">${completed}/${total}</div>
        </div>
      `;
    }

    // ----- WRITING -----
    function renderWriting() {
      const key = "writing";
      const section = lessonData.sections[key];
      const tasks = section.tasks;
      const total = tasks.length;
      const w = state.writing;

      if (w.finished) {
        const avgScore = state.progress[key].answeredCount > 0 ? Math.round(state.progress[key].correctCount / total) : 0;
        return `
          <div class="text-center py-4">
            <div class="flex justify-center mb-4">${gaugeHTML(total, total, 96)}</div>
            <h3 class="text-[20px] font-semibold" style="color:${COLORS.ink};font-family:'Fraunces',serif;">Section terminée</h3>
            <p class="text-[15px] mb-1">Score moyen : <span class="font-semibold">${avgScore}%</span></p>
            <div class="flex gap-2 justify-center mt-4 flex-wrap">
              <button class="btn-primary" data-action="back-to-menu">Retour aux modules</button>
              <button class="btn-secondary" data-action="restart-writing">🔄 Recommencer</button>
            </div>
          </div>
        `;
      }

      const task = tasks[w.index];
      const wc = w.text.trim().split(/\s+/).filter(Boolean).length;

      let html = `
        <div class="flex items-center justify-between mb-4">
          <button class="text-sm" style="color:${COLORS.muted};background:none;border:none;cursor:pointer;" data-action="back-to-menu">← Modules</button>
          <span class="text-xs font-semibold uppercase tracking-wide" style="color:${COLORS.gold};">Tâche ${w.index+1}/${total}</span>
          <div>${gaugeHTML(total, state.progress[key].answeredCount, 52)}</div>
        </div>
        <p class="text-[15.5px] leading-relaxed mb-4">${task.prompt}</p>
        <textarea class="w-full px-3.5 py-3 rounded-lg border-2 outline-none text-[14.5px] leading-relaxed resize-none" 
          style="border-color:${COLORS.border};background:${COLORS.card};font-family:inherit;" 
          rows="3" placeholder="Écris ta réponse..." ${w.validated ? 'disabled' : ''} data-writing-text>${w.text}</textarea>
        <p class="text-xs mt-1.5" style="color:${COLORS.faint};">${wc} mot${wc > 1 ? "s" : ""} (minimum ${task.minWords})</p>
      `;

      if (w.validated) {
        const score = Math.min(100, Math.round(scoreWritingTask(w.text, task)));
        html += `
          <div class="p-3 rounded-lg mt-3" style="background:${COLORS.cream};border:1px solid ${COLORS.border};">
            <p class="text-sm" style="color:${COLORS.muted};">Score : ${score}% — mots-clés attendus : ${task.keywords.join(", ")}</p>
          </div>
        `;
      }

      if (!w.validated) {
        html += `<button class="btn-primary w-full mt-4" data-action="validate-writing" ${w.text.trim().length === 0 ? 'disabled' : ''}>Valider</button>`;
      } else {
        html += `<button class="btn-primary w-full mt-4" style="background:${COLORS.ink};" data-action="next-writing">${w.index + 1 >= total ? "Voir mon score" : "Tâche suivante"} →</button>`;
      }

      return html;
    }

    function scoreWritingTask(text, task) {
      const wc = text.trim().split(/\s+/).filter(Boolean).length;
      const kwFound = task.keywords.filter(k => containsWholeKeyword(text, k)).length;
      const kwScore = (kwFound / task.keywords.length) * 70;
      const lenScore = wc >= task.minWords ? 30 : (wc / task.minWords) * 30;
      return Math.min(100, kwScore + lenScore);
    }

    // ================================================================
    //  ÉVÉNEMENTS
    // ================================================================
    function attachEvents() {
      // Sélecteur de leçon
      document.querySelectorAll('[data-lesson]').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const num = parseInt(this.dataset.lesson);
          if (num !== currentLessonKey) switchLesson(num);
        });
      });

      // Menu sections
      document.querySelectorAll('[data-section]').forEach(btn => {
        btn.addEventListener('click', function(e) {
          state.activeSection = this.dataset.section;
          state.view = "intro";
          resetQuizState();
          render();
        });
      });

      // Back to menu
      document.querySelectorAll('[data-action="back-to-menu"]').forEach(btn => {
        btn.addEventListener('click', function(e) {
          state.view = "menu";
          render();
        });
      });

      // Start quiz
      document.querySelectorAll('[data-action="start-quiz"]').forEach(btn => {
        btn.addEventListener('click', function(e) {
          state.view = "quiz";
          const key = state.activeSection;
          const p = state.progress[key];
          const total = sectionTotal(key);
          if (p.answeredCount >= total) state.quiz.stage = "sectionDone";
          else {
            state.quiz.stage = "question";
            state.quiz.index = Math.min(p.answeredCount, total - 1);
            state.quiz.answer = null;
            state.quiz.validated = false;
            state.quiz.batchCorrect = 0;
            state.quiz.batchAnswered = 0;
          }
          render();
        });
      });

      // MCQ options
      document.querySelectorAll('[data-opt-index]').forEach(btn => {
        btn.addEventListener('click', function(e) {
          if (this.disabled) return;
          state.quiz.answer = parseInt(this.dataset.optIndex);
          render();
        });
      });

      // Fill input
      document.querySelectorAll('[data-fill-input]').forEach(inp => {
        inp.addEventListener('input', function(e) {
          state.quiz.answer = this.value;
          const validateBtn = document.querySelector('[data-action="validate"]');
          if (validateBtn) {
            validateBtn.disabled = state.quiz.answer === null || state.quiz.answer.trim().length === 0;
          }
        });
      });

      // True/false
      document.querySelectorAll('[data-tf-value]').forEach(btn => {
        btn.addEventListener('click', function(e) {
          if (this.disabled) return;
          state.quiz.answer = this.dataset.tfValue === 'true';
          render();
        });
      });

      // Validate
      document.querySelectorAll('[data-action="validate"]').forEach(btn => {
        btn.addEventListener('click', function(e) {
          if (this.disabled) return;
          const key = state.activeSection;
          const ex = lessonData.sections[key].exercises[state.quiz.index];
          const correct = isExerciseCorrect(ex, state.quiz.answer);
          state.quiz.batchAnswered += 1;
          if (correct) state.quiz.batchCorrect += 1;
          const p = state.progress[key];
          if (state.quiz.index >= p.answeredCount) {
            state.progress[key] = {
              answeredCount: Math.max(p.answeredCount, state.quiz.index + 1),
              correctCount: p.correctCount + (correct ? 1 : 0),
            };
          }
          state.quiz.validated = true;
          render();
        });
      });

      // Next question
      document.querySelectorAll('[data-action="next-question"]').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const key = state.activeSection;
          const total = lessonData.sections[key].exercises.length;
          const batchStart = Math.floor(state.quiz.index / BATCH_SIZE) * BATCH_SIZE;
          const batchEnd = Math.min(batchStart + BATCH_SIZE, total) - 1;
          if (state.quiz.index === batchEnd) state.quiz.stage = "batchDone";
          else { state.quiz.index += 1;
            state.quiz.answer = null;
            state.quiz.validated = false; }
          render();
        });
      });

      // Restart batch
      document.querySelectorAll('[data-action="restart-batch"]').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const key = state.activeSection;
          const total = lessonData.sections[key].exercises.length;
          const batchStart = Math.floor(state.quiz.index / BATCH_SIZE) * BATCH_SIZE;
          state.quiz.index = batchStart;
          state.quiz.answer = null;
          state.quiz.validated = false;
          state.quiz.batchCorrect = 0;
          state.quiz.batchAnswered = 0;
          state.quiz.stage = "question";
          render();
        });
      });

      // Next batch
      document.querySelectorAll('[data-action="next-batch"]').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const key = state.activeSection;
          const total = lessonData.sections[key].exercises.length;
          const batchStart = Math.floor(state.quiz.index / BATCH_SIZE) * BATCH_SIZE;
          const nextStart = Math.min(batchStart + BATCH_SIZE, total);
          if (nextStart >= total) state.quiz.stage = "sectionDone";
          else { state.quiz.index = nextStart;
            state.quiz.answer = null;
            state.quiz.validated = false;
            state.quiz.batchCorrect = 0;
            state.quiz.batchAnswered = 0;
            state.quiz.stage = "question"; }
          render();
        });
      });

      // Finish section
      document.querySelectorAll('[data-action="finish-section"]').forEach(btn => {
        btn.addEventListener('click', function(e) {
          state.quiz.stage = "sectionDone";
          render();
        });
      });

      // Restart section
      document.querySelectorAll('[data-action="restart-section"]').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const key = state.activeSection;
          state.progress[key] = { answeredCount: 0, correctCount: 0 };
          resetQuizState();
          state.quiz.stage = "question";
          state.quiz.index = 0;
          render();
        });
      });

      // Writing input
      document.querySelectorAll('[data-writing-text]').forEach(el => {
        el.addEventListener('input', function(e) {
          state.writing.text = this.value;
          const validateBtn = document.querySelector('[data-action="validate-writing"]');
          if (validateBtn) {
            validateBtn.disabled = state.writing.text.trim().length === 0;
          }
        });
      });

      // Validate writing
      document.querySelectorAll('[data-action="validate-writing"]').forEach(btn => {
        btn.addEventListener('click', function(e) {
          if (this.disabled) return;
          const task = lessonData.sections.writing.tasks[state.writing.index];
          const score = scoreWritingTask(state.writing.text, task);
          const p = state.progress.writing;
          state.progress.writing = {
            answeredCount: Math.max(p.answeredCount, state.writing.index + 1),
            correctCount: p.correctCount + score,
          };
          state.writing.validated = true;
          render();
        });
      });

      // Next writing
      document.querySelectorAll('[data-action="next-writing"]').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const total = lessonData.sections.writing.tasks.length;
          if (state.writing.index + 1 >= total) state.writing.finished = true;
          else { state.writing.index += 1;
            state.writing.text = "";
            state.writing.validated = false; }
          render();
        });
      });

      // Restart writing
      document.querySelectorAll('[data-action="restart-writing"]').forEach(btn => {
        btn.addEventListener('click', function(e) {
          state.progress.writing = { answeredCount: 0, correctCount: 0 };
          state.writing.index = 0;
          state.writing.text = "";
          state.writing.validated = false;
          state.writing.finished = false;
          render();
        });
      });
    }

    function resetQuizState() {
      state.quiz = { index: 0, answer: null, validated: false, stage: "question", batchCorrect: 0, batchAnswered: 0 };
      state.writing = { index: 0, text: "", validated: false, finished: false };
    }

    // ================================================================
    //  LANCEMENT
    // ================================================================
    render();
  </script>
</body>
</html>
``
